name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.10"
      - run: npm ci
      - run: npm test
      - run: npm audit --audit-level=high
      - run: npx -y skills-ref validate skills/realistic-job-market-research
      - run: python3 -m py_compile skills/realistic-job-market-research/scripts/*.py

  compatibility:
    name: compatibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - run: npm ci
      - run: npm test

  browser-qa:
    name: browser-qa
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Create synthetic run
        run: |
          echo "RUN_DIR=$(mktemp -d)" >> "$GITHUB_ENV"
      - run: node skills/realistic-job-market-research/scripts/create-public-fixture.mjs --run-dir "$RUN_DIR"
      - run: node skills/realistic-job-market-research/scripts/record-qa.mjs --run-dir "$RUN_DIR"
      - run: node skills/realistic-job-market-research/scripts/audit-run.mjs --run-dir "$RUN_DIR" --qa "$RUN_DIR/qa-evidence.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-qa
          path: |
            ${{ env.RUN_DIR }}/qa-evidence.json
            ${{ env.RUN_DIR }}/audit.json
            ${{ env.RUN_DIR }}/qa/*.png
